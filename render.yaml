# Single Render web service: API + MCP + built React SPA.
# Create a Blueprint from this file, then set secret env vars in the dashboard.
# Do not commit secret values.

services:
  - type: web
    name: karma
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build && cd ../frontend/app && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: LOG_LEVEL
        value: info
      - key: KARMA_CODE_WORKSPACE_ROOT
        value: /tmp/karma-code-workspaces
      # Set these in the Render dashboard (sync: false). Do not put secrets here.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: SECRETS_MASTER_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: FRONTEND_URL
        sync: false
      - key: OPENROUTER_FALLBACK_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
